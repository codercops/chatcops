version: 1
name: Docs bot citations
# Each question has the page that answers it. scripts/citation-eval.mjs runs
# this file and passes at 85% correct citations, not 100%: some questions
# have a second page that answers them just as well.
tests:
  - name: "01 What packages make up ChatCops, and what does each one do?"
    tags: [citations]
    turns:
      - user: "What packages make up ChatCops, and what does each one do?"
        expect:
          - cites: "https://chat.codercops.com/"
